 [20.6,28.2,'La nube, o kumo, es la zona entre Senkou A y B, proyectada 26 periodos hacia adelante.','La nube, o kumo, es la zona entre Senkou A y B, proyectada veintiséis periodos hacia adelante.'],
 [28.4,35.0,'Lectura habitual: precio sobre la nube, sesgo alcista; bajo la nube, bajista; dentro, indecisión.'],
 [35.2,43.4,'Chikou es el cierre de hoy dibujado 26 periodos atrás. Una nube gruesa es más difícil de atravesar.','Chikou es el cierre de hoy dibujado veintiséis periodos atrás. Una nube gruesa es más difícil de atravesar.'],
 [43.6,49.6,'Para tu robot: reglas objetivas, pero sin garantías. Fuente: MQL5. Educativo.'],

const PAPER='#eef4f0',INK='#23363d',CO='#e8553d',TQ='#119da4',VI='#7b4bb7',OC='#e0a21a',DK='#23363d',ACC='#e0a21a',FAM='Inter';

ST.bg=t=>{ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);const r=rng(23);const cols=[TQ,CO,VI,OC,TQ,VI];

  ctx.save();ctx.globalAlpha=.05;const q=rng(5);for(let i=0;i<500;i++){ctx.fillStyle=INK;ctx.fillRect(q()*W,q()*H,2,2)}ctx.restore();ctx.fillStyle=TQ;ctx.fillRect(0,0,W,10)};
// ---- datos ilustrativos y cálculo real de Ichimoku ----
const N=120,PO=[],PH=[],PL=[],PC=[];
(function(){const r=rng(41);let p=100;const dr=i=>i<45?1.1:i<70?0:i<100?-1.3:.8;for(let i=0;i<N;i++){const o=p;p+=dr(i)+(r()-.5)*4.2;const hi=Math.max(o,p)+r()*2.2,lo=Math.min(o,p)-r()*2.2;PO.push(o);PC.push(p);PH.push(hi);PL.push(lo)}})();
function mid(i,n){if(i<n-1)return null;let h=-1e9,l=1e9;for(let k=i-n+1;k<=i;k++){h=Math.max(h,PH[k]);l=Math.min(l,PL[k])}return (h+l)/2}
const TEN=PC.map((_,i)=>mid(i,9)),KIJ=PC.map((_,i)=>mid(i,26)),SPB=PC.map((_,i)=>mid(i,52)),SPA=PC.map((_,i)=>TEN[i]!=null&&KIJ[i]!=null?(TEN[i]+KIJ[i])/2:null);
let vmin=1e9,vmax=-1e9;PH.forEach(v=>vmax=Math.max(vmax,v));PL.forEach(v=>vmin=Math.min(vmin,v));vmin-=4;vmax+=4;
// opts: n (barras visibles 0..N), ten, kij, cloud, chikou, candles
function ichi(X,Y,Wd,Hh,o){const M=N+26,bw=Wd/M;const px=i=>X+(i+.5)*bw,py=v=>Y+Hh-(v-vmin)/(vmax-vmin)*Hh;const n=Math.floor(o.n);
  ctx.save();ctx.strokeStyle='rgba(35,54,61,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X,Y+Hh);ctx.lineTo(X+Wd,Y+Hh);ctx.stroke();ctx.restore();
  if(o.cloud){for(let i=0;i<n;i++){const j=i+26;if(SPA[i]==null||SPB[i]==null||SPA[i+1]==null||SPB[i+1]==null||i+1>=n)continue;const up=SPA[i]>=SPB[i];
    ctx.beginPath();ctx.moveTo(px(j),py(SPA[i]));ctx.lineTo(px(j+1),py(SPA[i+1]));ctx.lineTo(px(j+1),py(SPB[i+1]));ctx.lineTo(px(j),py(SPB[i]));ctx.closePath();ctx.fillStyle=up?'rgba(17,157,164,.38)':'rgba(232,85,61,.38)';ctx.fill()}}
  const ln=(arr,col,lw,sh=0)=>{ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.beginPath();let st=false;for(let i=0;i<n;i++){if(arr[i]==null)continue;const x=px(i+sh);const y=py(arr[i]);if(!st){ctx.moveTo(x,y);st=true}else ctx.lineTo(x,y)}ctx.stroke();ctx.restore()};
  if(o.cloud){ln(SPA,'rgba(17,157,164,.9)',3,26);ln(SPB,'rgba(232,85,61,.9)',3,26)}
  if(o.chikou){ctx.save();ctx.strokeStyle=VI;ctx.lineWidth=5;ctx.setLineDash([10,8]);ctx.beginPath();let st=false;for(let i=26;i<n;i++){const x=px(i-26),y=py(PC[i]);if(!st){ctx.moveTo(x,y);st=true}else ctx.lineTo(x,y)}ctx.stroke();ctx.restore()}
  // velas
  for(let i=0;i<n;i++){const up=PC[i]>=PO[i];const c=up?TQ:CO;ctx.strokeStyle=c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px(i),py(PH[i]));ctx.lineTo(px(i),py(PL[i]));ctx.stroke();ctx.fillStyle=c;const y1=py(Math.max(PO[i],PC[i])),y2=py(Math.min(PO[i],PC[i]));ctx.fillRect(px(i)-bw*.32,y1,bw*.64,Math.max(2,y2-y1))}
  if(o.ten)ln(TEN,OC,5);if(o.kij)ln(KIJ,VI,5)}
const CH=[60,420,960,600];
