</style></head><body><canvas id="c"></canvas><script src="common.js"></script><script>
// Estilo: pizarra con tiza — tema: backtest vs cuenta real
const SPEC={name:'BacktestReal',hook:'¿BACKTEST O CUENTA REAL?',bpm:100,prog:[[57,'m'],[53,'M'],[60,'M'],[55,'M']],
 ev:[[0.3,'alert'],[3.3,'blip',660],[5.6,'down'],[7.8,'blip',784],[10.0,'ding'],[12.3,'blip',880],[14.4,'chime'],[17.2,'cta']],
 subs:[[0.2,3.0,'Backtest o cuenta real: ¿en cuál confías?'],
 [3.2,7.4,'El backtest prueba la estrategia con datos pasados. Es útil, pero el pasado no garantiza el futuro.'],
 [7.7,11.8,'En cuenta real hay spread variable, slippage y emociones que el simulador no refleja del todo.'],
 [12.1,16.8,'Lo sensato: primero backtest, luego demo, y después cuenta real con lote pequeño.'],
 [17.2,20.8,'Securus Apex. Link en bio.']]};
const CH='#f4f1e6',YL='#f6e08a',PK='#ff9aa8',BL='#9fd8ff',GR='#a8f0b8';
const STY={subFont:'800 46px Inter',subBg:'rgba(14,32,26,.92)',subStroke:YL,subFill:'#fffbe8',ctaBg:'#14302a',ctaSub:YL,ctaGlow:'#000',
 ctaAccent:YL,ctaBtnText:'#14302a',ctaFontS:'800 52px Inter',ctaFontL:'900 110px Inter'};
boot(['800 40px Inter','900 40px Inter']);
const rd=rng(3);const DUST=[];for(let i=0;i<260;i++)DUST.push([rd()*W,rd()*H,rd()*2.4+.6,rd()*.12]);
function bg(){const g=ctx.createRadialGradient(540,900,200,540,900,1300);g.addColorStop(0,'#2a5547');g.addColorStop(1,'#12302a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';DUST.forEach(([x,y,r,a])=>{ctx.globalAlpha=a;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()});ctx.globalAlpha=1;
  ctx.strokeStyle='#6b4a2b';ctx.lineWidth=36;ctx.strokeRect(18,18,W-36,H-36);ctx.strokeStyle='#8a6439';ctx.lineWidth=6;ctx.strokeRect(36,36,W-72,H-72);
  RR(120,1700,840,22,10);ctx.fillStyle='rgba(255,255,255,.1)';ctx.fill()}
function ch(s,x,y,sz,col=CH,a=1,al='center',w=900){T(s,x,y,{font:`${w} ${sz}px Inter`,fill:col,a:a*.94,align:al,glow:col,gb:3})}
// trazo de tiza con temblor
function stroke(pts,k,col=CH,lw=9){const n=pts.length-1;const f=k*n;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=.92;ctx.beginPath();
  for(let i=0;i<=Math.floor(f)&&i<=n;i++){const [x,y]=pts[i];i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  if(f<n){const i=Math.floor(f),fr=f-i;ctx.lineTo(lerp(pts[i][0],pts[i+1][0],fr),lerp(pts[i][1],pts[i+1][1],fr))}ctx.stroke();ctx.restore()}
function fade(t,a,b){return Math.min(prog(t,a,a+.35),1-prog(t,b-.3,b))}
function num(n,x,y,col,t,ts){const k=eback(prog(t,ts,ts+.5));if(k<=0)return;ctx.save();ctx.translate(x,y);ctx.scale(k,k);ctx.beginPath();ctx.arc(0,0,70,0,7);ctx.strokeStyle=col;ctx.lineWidth=8;ctx.stroke();T(n,0,6,{font:'900 90px Inter',fill:col});ctx.restore()}
function draw(t){bg();
  const k=eio(prog(t,2.6,3.4));
  if(k<1){const sc=1+.25*k;ctx.save();ctx.globalAlpha=1-k;ctx.translate(540,800);ctx.scale(sc,sc);
    ch('¿BACKTEST',0,-170,120,YL);ch('O',0,-30,90,CH);ch('CUENTA REAL?',0,110,110,GR);
    stroke([[-400,200],[-120,215],[130,195],[400,210]],eio(prog(t,.6,1.5)),YL,10);ctx.restore()}
  if(k>0){ch('BACKTEST VS REAL',540,330,52,YL,k);stroke([[200,370],[540,380],[880,368]],k,CH,6)}
  let a=fade(t,3.2,7.5);if(a>0){ctx.save();ctx.globalAlpha=a;num('1',210,560,YL,t,3.3);
    ch('BACKTEST',650,520,80,CH,1);ch('DATOS PASADOS',650,610,64,BL,1);
    const r=rng(5);const p=[];let y=1150;for(let i=0;i<=24;i++){y-=14+(r()-.35)*26;p.push([200+i*28,y])}
    stroke(p,eio(prog(t,4.0,6.0)),GR,9);line(180,1220,920,1220,CH,5);line(180,1220,180,780,CH,5);
    ch('curva ilustrativa',540,1290,46,BL,prog(t,5.8,6.4));
    ch('≠ futuro',760,860,64,PK,prog(t,6.3,6.9));ctx.restore()}
  a=fade(t,7.7,11.9);if(a>0){ctx.save();ctx.globalAlpha=a;num('2',210,560,YL,t,7.8);
    ch('CUENTA',650,520,80,CH,1);ch('REAL',650,610,90,PK,1);
    const r=rng(9);const p=[];let y=1150;for(let i=0;i<=24;i++){y-=8+(r()-.5)*70;p.push([200+i*28,y])}
    stroke(p,eio(prog(t,8.3,10.0)),PK,9);line(180,1220,920,1220,CH,5);line(180,1220,180,780,CH,5);
    [['spread',YL,9.2,300,880],['slippage',BL,9.8,640,960],['emociones',GR,10.4,420,1050]].forEach(([s,c,ts,x,yy])=>ch(s,x,yy,46,c,prog(t,ts,ts+.5)));
    ctx.restore()}
  a=fade(t,12.1,17.0);if(a>0){ctx.save();ctx.globalAlpha=a;num('3',210,560,YL,t,12.2);
    ch('EL CAMINO',650,520,76,CH,1);ch('SENSATO',650,610,86,PK,1);
    [['backtest',GR,12.9],['demo',BL,13.9],['real · lote pequeño',YL,14.9]].forEach(([s,c,ts],i)=>{
      const kk=eout(prog(t,ts,ts+.5));const y=800+i*150;ctx.save();ctx.globalAlpha=a*kk;
      RR(190,y-55,700,110,26);ctx.strokeStyle=c;ctx.lineWidth=7;ctx.stroke();ch((i+1)+'. '+s,540,y+4,s.length>12?46:56,c,1);ctx.restore()});
    ctx.restore()}
}
function cover(){bg();ctx.save();ctx.translate(0,40);
  ch('BACKTEST',540,430,120,YL);ch('≠',540,590,130,PK);ch('CUENTA REAL',540,740,110,CH);
  stroke([[130,810],[420,825],[700,805],[950,820]],1,YL,10);
  ch('¿POR QUÉ NO SON',540,950,70,CH);ch('IGUALES?',540,1060,110,GR);
  RR(220,1170,640,110,55);ctx.fillStyle=YL;ctx.fill();T('DESCÚBRELO →',540,1227,{font:'900 44px Inter',fill:'#14302a'});ctx.restore()}
