 const k=eio(prog(t,a0,a1));const m=Math.floor(k*n);const cw=w/n;
 for(let i=0;i<m;i++){const [o,c,hi,lo]=C[i];const up=c>=o;const cx=x+i*cw+cw/2;ctx.strokeStyle=up?col1:col2;ctx.fillStyle=up?col1:col2;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx,y+h-hi*h);ctx.lineTo(cx,y+h-lo*h);ctx.stroke();const yt=y+h-Math.max(o,c)*h;ctx.fillRect(cx-cw*.3,yt,cw*.6,Math.max(4,Math.abs(c-o)*h))}

 return C}
