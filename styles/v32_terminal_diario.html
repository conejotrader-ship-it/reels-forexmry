// Estilo: terminal tipo MetaTrader — tema: por qué llevar un diario de trading
const SPEC={name:'DiarioTrading',hook:'¿LLEVAS UN DIARIO DE TRADING?',bpm:100,prog:[[52,'m'],[48,'M'],[55,'M'],[50,'M']],

 [7.8,12.0,'Con el tiempo ves patrones: horarios, errores repetidos y emociones que afectan tus decisiones.'],

const G='#26d07c',R='#ff4d4d',Y='#f2c94c',B='#4da3ff';
boot(['800 40px Inter','900 40px Inter']);
const rnd=rng(23);const CND=[];let pr=0;for(let i=0;i<60;i++){const o=pr,c=o+(rnd()-.5)*34;CND.push([o,c,Math.max(o,c)+rnd()*16,Math.min(o,c)-rnd()*16]);pr=c}
function bg(t){ctx.fillStyle='#0a0d12';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.strokeStyle='rgba(60,80,100,.28)';ctx.lineWidth=1;for(let x=0;x<W;x+=90){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}

  ctx.save();ctx.globalAlpha=.14;const off=(t*14)%34;for(let i=0;i<34;i++){const [o,c,h,l]=CND[i+Math.floor(t*0.4)%20];const x=i*34-off+10,y0=900-o*4,y1=900-c*4;const up=c>=o;ctx.strokeStyle=ctx.fillStyle=up?G:R;ctx.lineWidth=3;

  [R,Y,G].forEach((c,i)=>{ctx.beginPath();ctx.arc(x+34+i*34,y+32,10,0,7);ctx.fillStyle=c;ctx.fill()});

      tx(d,110,y,'#cfe3f5',34);tx('● '+e,960,y,c,34,1,'right');line(110,y+42,960,y+42,'rgba(157,179,200,.25)',2);ctx.restore()});
    const k=eback(prog(t,10.6,11.3));ctx.save();ctx.translate(540,1170);ctx.scale(k,k);RR(-420,-100,840,200,20);ctx.fillStyle='rgba(255,77,77,.12)';ctx.fill();ctx.strokeStyle=R;ctx.lineWidth=5;ctx.stroke();
    T('PATRÓN DETECTADO',0,-45,{font:'900 46px Inter',fill:R});T('operas con prisa',0,20,{font:'900 50px Inter',fill:'#fff'});T('(ejemplo ilustrativo)',0,72,{font:'800 28px Inter',fill:'#9db3c8'});ctx.restore();ctx.restore()}
