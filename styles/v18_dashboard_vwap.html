function bg(){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(34,211,238,.06)';ctx.lineWidth=2;

function gauge(cx,cy,r,v,col){ctx.save();ctx.lineWidth=44;ctx.lineCap='round';ctx.strokeStyle=LN;ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,2*Math.PI);ctx.stroke();
  ctx.strokeStyle=col;ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,Math.PI+Math.PI*v);ctx.stroke();ctx.restore()}
// series ilustrativas: puntos ancla interpolados + ruido, volumen aleatorio
function mk(anchors,n,seed){const r=rng(seed);const P=[],V=[];for(let i=0;i<n;i++){const f=i/(n-1)*(anchors.length-1),j=Math.min(anchors.length-2,Math.floor(f)),u=f-j;
  P.push(lerp(anchors[j],anchors[j+1],u)+(r()-.5)*.9);V.push(.5+r())}
  const W2=[];let sp=0,sv=0;for(let i=0;i<n;i++){sp+=P[i]*V[i];sv+=V[i];W2.push(sp/sv)}return [P,W2]}

const S2=mk([50,52,54,58,60,62,64,66],90,9);

function chart(x,y,w,h,S,k,opt={}){const [P,Wv]=S;const all=P.concat(Wv);const mn=Math.min(...all)-1,mx=Math.max(...all)+1;
  const X=i=>x+i/(P.length-1)*w,Y=v=>y+h-(v-mn)/(mx-mn)*h;const n=Math.floor(clamp(k)*(P.length-1));
  ctx.save();ctx.beginPath();ctx.rect(x-10,y-10,w+20,h+20);ctx.clip();
  for(let g=0;g<5;g++)line(x,y+g*h/4,x+w,y+g*h/4,'rgba(142,163,199,.18)',2);

  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle=OR;ctx.lineWidth=8;ctx.shadowColor=OR;ctx.shadowBlur=14;ctx.setLineDash([]);ctx.beginPath();for(let i=0;i<=n;i++)i?ctx.lineTo(X(i),Y(Wv[i])):ctx.moveTo(X(i),Y(Wv[i]));ctx.stroke();
  ctx.strokeStyle=CY;ctx.lineWidth=6;ctx.shadowColor=CY;ctx.shadowBlur=10;ctx.beginPath();for(let i=0;i<=n;i++)i?ctx.lineTo(X(i),Y(P[i])):ctx.moveTo(X(i),Y(P[i]));ctx.stroke();ctx.restore();
  return {X,Y,n}}

    chart(130,680,820,340,S1,eio(prog(t,.5,2.4)));legend(130,1090);

  a=fade(t,3.2,7.7);if(a>0){ctx.save();ctx.globalAlpha=a;

    card(70,800,940,640,eout(prog(t,5.4,6.0)));legend(120,870,prog(t,5.8,6.3));
    chart(120,930,840,420,S1,eio(prog(t,5.6,7.2)));
    ctx.restore()}
  a=fade(t,7.9,12.1);if(a>0){ctx.save();ctx.globalAlpha=a;

    chart(120,360,840,560,S2,eio(prog(t,8.2,10.2)),{zones:true});

    T('SOBRE VWAP',0,-28,{font:'900 40px Inter',fill:GR});T('fuerza compradora',0,32,{font:'800 30px Inter',fill:TX});ctx.restore();
    const r=eback(prog(t,11.0,11.6));
    ctx.save();ctx.translate(770,1060);ctx.scale(r,r);RR(-190,-80,380,160,24);ctx.fillStyle='rgba(255,84,112,.15)';ctx.fill();ctx.strokeStyle=RD;ctx.lineWidth=4;ctx.stroke();
    T('BAJO VWAP',0,-28,{font:'900 40px Inter',fill:RD});T('fuerza vendedora',0,32,{font:'800 30px Inter',fill:TX});ctx.restore();
    ctx.restore()}
  a=fade(t,12.3,17.0);if(a>0){ctx.save();ctx.globalAlpha=a;
    card(70,230,940,700,eout(prog(t,12.3,12.9)),GR);legend(120,300,prog(t,12.6,13.1));
    const c=chart(120,350,840,520,S3,eio(prog(t,12.6,14.6)));
    const m=eback(prog(t,14.4,15.0));if(m>0&&c.n>=70){const i=72;ctx.save();ctx.translate(c.X(i),c.Y(S3[0][i]));ctx.scale(m,m);ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.fillStyle=GR;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=BG;ctx.stroke();ctx.restore();

    card(70,980,940,430,eout(prog(t,13.4,14.0)));
    [['Espera el retroceso al VWAP',GR,13.8],['Confirma con la vela',CY,14.8],['Define el stop loss',RD,15.8]].forEach(([s2,col,ts],i)=>{const k=eout(prog(t,ts,ts+.5));ctx.save();ctx.globalAlpha=a*k;
