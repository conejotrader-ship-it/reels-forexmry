<!doctype html><html><head><meta charset="utf-8"><style>

// Estilo: terminal tipo MetaTrader — tema: slippage
const SPEC={name:'Slippage',hook:'¿TE EJECUTARON A OTRO PRECIO?',bpm:108,prog:[[52,'m'],[48,'M'],[55,'M'],[50,'M']],
 ev:[[0.3,'alert'],[3.3,'blip',880],[5.4,'ding'],[7.4,'tick'],[9.4,'down'],[11.5,'blip',784],[13.4,'ding'],[15.1,'chime'],[17.2,'cta']],
 subs:[[0.2,3.0,'¿Pediste un precio y te ejecutaron otro? Eso es slippage.'],
 [3.2,7.1,'Slippage es la diferencia entre el precio que pides y el precio en que se ejecuta la orden.'],
 [7.3,11.2,'Ocurre cuando el precio se mueve rápido, por ejemplo con noticias, o cuando hay poca liquidez.'],
 [11.4,15.0,'Puede ser a favor o en contra. Reduce el riesgo evitando operar justo en las noticias.'],
 [15.2,16.95,'Es parte normal del mercado.'],
 [17.2,20.8,'Securus Apex. Link en bio.']]};
const G='#26d07c',R='#ff4d4d',Y='#f2c94c',B='#4da3ff',M='font-family:"DejaVu Sans Mono",monospace';
const MONO=w=>`${w} 36px "DejaVu Sans Mono",monospace`;
const STY={subFont:'800 46px Inter',subBg:'rgba(5,8,12,.9)',subStroke:G,subFill:'#e9fff4',ctaBg:'#05080c',ctaSub:G,ctaGlow:G,
 ctaAccent:G,ctaBtnText:'#05080c',ctaFontS:'800 52px Inter',ctaFontL:'900 110px Inter'};
boot(['800 40px Inter','900 40px Inter']);
const rnd=rng(7);const CND=[];let pr=0;for(let i=0;i<60;i++){const o=pr,c=o+(rnd()-.47)*34;CND.push([o,c,Math.max(o,c)+rnd()*16,Math.min(o,c)-rnd()*16]);pr=c}
function bg(t){ctx.fillStyle='#0a0d12';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.strokeStyle='rgba(60,80,100,.28)';ctx.lineWidth=1;for(let x=0;x<W;x+=90){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=90){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();
  // velas de fondo, tenues y en movimiento
  ctx.save();ctx.globalAlpha=.16;const off=(t*14)%34;for(let i=0;i<34;i++){const [o,c,h,l]=CND[i+Math.floor(t*0.4)%20];const x=i*34-off+10,y0=900+ -o*4,y1=900-c*4;const up=c>=o;ctx.strokeStyle=ctx.fillStyle=up?G:R;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x+10,900-h*4);ctx.lineTo(x+10,900-l*4);ctx.stroke();ctx.fillRect(x,Math.min(y0,y1),20,Math.max(6,Math.abs(y1-y0)))}ctx.restore()}
function win(x,y,w,h,title,col=G){RR(x,y,w,h,18);ctx.fillStyle='rgba(12,17,24,.94)';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=3;ctx.stroke();
  ctx.save();RR(x,y,w,64,18);ctx.clip();ctx.fillStyle='#16202c';ctx.fillRect(x,y,w,64);ctx.restore();
  [R,Y,G].forEach((c,i)=>{ctx.beginPath();ctx.arc(x+34+i*34,y+32,10,0,7);ctx.fillStyle=c;ctx.fill()});
  T(title,x+w-24,y+33,{font:MONO("700"),fill:"#9db3c8",align:"right"})}
function tx(s,x,y,col,sz=34,a=1,al='left',w='700'){T(s,x,y,{font:`${w} ${sz}px "DejaVu Sans Mono",monospace`,fill:col,align:al,a})}
function typed(s,t,ts,cps=28){return s.slice(0,Math.max(0,Math.floor((t-ts)*cps)))}
function fade(t,a,b){return Math.min(prog(t,a,a+.35),1-prog(t,b-.3,b))}
function draw(t){bg(t);
  tx('XAUUSD,M5   ●  Terminal',60,300,'#8fa6bb',30);
  const hk=1-eio(prog(t,2.7,3.3));
  if(hk>0){const bl=(Math.floor(t*4)%2)?1:.55;ctx.save();ctx.globalAlpha=hk;win(90,420,900,720,'ALERTA',Y);
    T('≠',540,640,{font:'900 190px Inter',fill:Y,a:bl,glow:Y,gb:40});
    T('PEDISTE UN PRECIO',540,820,{font:'900 64px Inter',fill:'#fff'});T('TE DIERON',540,930,{font:'900 84px Inter',fill:'#fff'});T('OTRO',540,1050,{font:'900 120px Inter',fill:R,glow:R,gb:24});ctx.restore()}
  // definición
  let a=fade(t,3.2,7.3);if(a>0){ctx.save();ctx.globalAlpha=a;win(70,420,940,760,'ORDEN.log');
    tx('> orden pedida:',110,530,'#cfe3f5',32);
    tx('  compra a 2.000,00',110,590,B,34,prog(t,3.6,4.0));
    tx(typed('> ejecutada en:',t,4.3),110,680,'#cfe3f5',32);
    tx('  compra a 2.000,50',110,740,R,34,prog(t,5.0,5.4));
    const k=eback(prog(t,5.4,6.0));ctx.save();ctx.translate(540,940);ctx.scale(k,k);RR(-300,-100,600,200,20);ctx.fillStyle='rgba(242,201,76,.12)';ctx.fill();ctx.strokeStyle=Y;ctx.lineWidth=5;ctx.stroke();
    T('SLIPPAGE',0,-30,{font:'900 70px Inter',fill:Y});T('= diferencia de precio',0,50,{font:'800 36px Inter',fill:'#fff'});ctx.restore();
    tx('*cifras ilustrativas',540,1130,'#6f879c',26,1,'center');ctx.restore()}
  // causas
  a=fade(t,7.3,11.3);if(a>0){ctx.save();ctx.globalAlpha=a;win(70,420,940,860,'CAUSAS.cfg');
    const k1=eout(prog(t,7.6,8.2)),k2=eout(prog(t,9.2,9.8));
    ctx.globalAlpha=a*k1;RR(110,520,860,240,16);ctx.fillStyle='rgba(255,77,77,.1)';ctx.fill();ctx.strokeStyle=R;ctx.lineWidth=3;ctx.stroke();
    T('MOVIMIENTO RÁPIDO',540,590,{font:'900 32px Inter',fill:R});T('NOTICIAS',540,660,{font:'900 64px Inter',fill:'#fff'});
    ctx.globalAlpha=a*k2;RR(110,820,860,240,16);ctx.fillStyle='rgba(77,163,255,.1)';ctx.fill();ctx.strokeStyle=B;ctx.stroke();
    T('POCA',540,880,{font:'900 32px Inter',fill:B});T('LIQUIDEZ',540,960,{font:'900 64px Inter',fill:'#fff'});ctx.restore()}
  // a favor o en contra
  a=fade(t,11.4,15.1);if(a>0){ctx.save();ctx.globalAlpha=a;win(70,420,940,860,'RESULTADO.sh');
    const k1=eback(prog(t,11.8,12.4)),k2=eback(prog(t,12.8,13.4));
    ctx.save();ctx.translate(300,720);ctx.scale(k1,k1);RR(-190,-130,380,260,20);ctx.fillStyle='rgba(38,208,124,.12)';ctx.fill();ctx.strokeStyle=G;ctx.lineWidth=4;ctx.stroke();
    T('▲',0,-50,{font:'900 80px Inter',fill:G});T('A FAVOR',0,50,{font:'900 44px Inter',fill:'#fff'});ctx.restore();
    ctx.save();ctx.translate(780,720);ctx.scale(k2,k2);RR(-190,-130,380,260,20);ctx.fillStyle='rgba(255,77,77,.12)';ctx.fill();ctx.strokeStyle=R;ctx.lineWidth=4;ctx.stroke();
    T('▼',0,-50,{font:'900 80px Inter',fill:R});T('EN CONTRA',0,50,{font:'900 44px Inter',fill:'#fff'});ctx.restore();
    tx('$ evita operar justo en noticias',540,1100,G,32,prog(t,13.6,14.1),'center');ctx.restore()}
  a=fade(t,15.2,17.1);if(a>0){ctx.save();ctx.globalAlpha=a;win(90,520,900,560,'NOTA',Y);
    T('SLIPPAGE',540,730,{font:'900 100px Inter',fill:'#fff'});T('ES NORMAL',540,880,{font:'900 100px Inter',fill:Y,glow:Y,gb:18});
    T('en el mercado real',540,990,{font:'800 44px Inter',fill:'#9db3c8'});ctx.restore()}
}
function cover(){bg(3);ctx.save();win(80,330,920,880,'ALERTA',Y);
  T('≠',540,540,{font:'900 170px Inter',fill:Y,glow:Y,gb:36});T('¿PEDISTE UN PRECIO',540,720,{font:'900 62px Inter',fill:'#fff'});T('Y TE DIERON',540,810,{font:'900 76px Inter',fill:'#fff'});
  T('OTRO?',540,960,{font:'900 140px Inter',fill:R,glow:R,gb:24});
  RR(220,1060,640,100,50);ctx.fillStyle=G;ctx.fill();T('▶ ENTIENDE POR QUÉ',540,1112,{font:'900 38px Inter',fill:'#05080c'});ctx.restore()}
</script></body></html>
