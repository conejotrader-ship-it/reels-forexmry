function L(s,x,y,sz,col=WH,a=1,al='center',maxW=960){s=_s(s);ctx.save();while(sz>20){ctx.font=`900 ${sz}px Inter`;if(ctx.measureText(s).width<=maxW)break;sz-=2}ctx.restore();T(s,x,y,{font:`900 ${sz}px Inter`,fill:col,a,align:al})}

function bg(t){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(540,700,60,540,700,950);g.addColorStop(0,'#1b2c6b');g.addColorStop(1,'#0a123000');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle=CY;ctx.fillRect(0,0,W,10)}
function head(t,t0,s,col=CY){L(s,540,175,54,col,eout(prog(t,t0,t0+.5)))}
function panel(x,y,w,h,col){ctx.save();ctx.fillStyle=PN;RR(x,y,w,h,22);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=col;ctx.stroke();ctx.restore()}
// velocímetro semicircular: v 0..1
function gauge(cx,cy,R,v,alpha=1){ctx.save();ctx.globalAlpha*=alpha;const a0=Math.PI,a1=Math.PI*2;
  [[0,.6,GN],[.6,.85,AM],[.85,1,RD]].forEach(([u,w,c])=>{ctx.strokeStyle=c;ctx.lineWidth=70;ctx.lineCap='butt';ctx.beginPath();ctx.arc(cx,cy,R,lerp(a0,a1,u),lerp(a0,a1,w));ctx.stroke()});
  for(let i=0;i<=10;i++){const a=lerp(a0,a1,i/10);line(cx+Math.cos(a)*(R-50),cy+Math.sin(a)*(R-50),cx+Math.cos(a)*(R-76),cy+Math.sin(a)*(R-76),WH,5)}
  const a=lerp(a0,a1,clamp(v));ctx.strokeStyle=WH;ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*(R-30),cy+Math.sin(a)*(R-30));ctx.stroke();ctx.fillStyle=CY;ctx.beginPath();ctx.arc(cx,cy,30,0,7);ctx.fill();ctx.restore()}
function bell(x0,x1,yb,hm,shade,cut){ // campana con cola sombreada a la izquierda de 'cut' (0..1)
  const f=u=>Math.exp(-Math.pow((u-.5)/.17,2)/2);ctx.save();
  ctx.beginPath();ctx.moveTo(x0,yb);for(let i=0;i<=100;i++){const u=i/100;ctx.lineTo(lerp(x0,x1,u),yb-hm*f(u))}ctx.lineTo(x1,yb);ctx.closePath();ctx.fillStyle='rgba(77,225,255,.25)';ctx.fill();ctx.strokeStyle=CY;ctx.lineWidth=6;ctx.stroke();
  if(shade){ctx.beginPath();ctx.moveTo(x0,yb);for(let i=0;i<=100;i++){const u=i/100*cut;ctx.lineTo(lerp(x0,x1,u),yb-hm*f(u))}ctx.lineTo(lerp(x0,x1,cut),yb);ctx.closePath();ctx.fillStyle=RD;ctx.fill()}
  line(x0-20,yb,x1+20,yb,MU,4);ctx.restore()}

function b4(t,a){ctx.save();ctx.globalAlpha=a;head(t,28.6,'2008: FALSA SEGURIDAD',RD);

function b5(t,a){ctx.save();ctx.globalAlpha=a;head(t,35.4,'EL SUSTITUTO: EXPECTED SHORTFALL',GN);

  let a=fade(t,0,6.0);if(t<.3)a=1;if(a>0)h0(t,a);
