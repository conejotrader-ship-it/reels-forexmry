const S=8,LW=135,LH=240;const LC=document.createElement('canvas');LC.width=LW;LC.height=LH;const L=LC.getContext('2d');
function P(x,y,w,h,c){L.fillStyle=c;L.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))}
function pxLine(pts,c,k=1,th=2){const n=pts.length-1;const end=k*n;for(let i=0;i<n;i++){if(i>end)break;const g=Math.min(1,end-i);const [x0,y0]=pts[i],[x1,y1]=pts[i+1];const steps=Math.max(1,Math.round(Math.abs(x1-x0)*g));for(let s=0;s<=steps;s++){const u=s/steps*g;P(x0+(x1-x0)*u,y0+(y1-y0)*u,th,th,c)}}}
function turtle(x,y,s,t,col=GM,dark=GD,fl=false){const b=Math.round(Math.sin(t*6)*1);ctx;
  const R=(dx,dy,w,h,c)=>P(x+(fl?-dx-w:dx)*s,y+(dy+0)*s+b*0,w*s,h*s,c);

  // patas
  const lg=Math.round(Math.sin(t*8))>0?1:0;R(2,7+lg,2,2,dark);R(8,7+(1-lg),2,2,dark);R(11,7+lg,2,2,dark);
  // caparazón
  R(2,1,10,2,col);R(1,3,12,4,col);R(3,0,6,1,dark);
  R(4,2,2,2,dark);R(8,2,2,2,dark);R(6,4,2,2,dark);R(2,4,2,2,dark);R(10,4,2,2,dark);
  // cabeza
  R(13,3,3,3,col);R(15,4,1,1,NV);R(0,5,2,1,dark)}
function lcBg(t){L.fillStyle=NV;L.fillRect(0,0,LW,LH);for(let i=0;i<40;i++){const r=rng(i+3);const x=Math.floor(r()*LW),y=Math.floor(r()*LH*.5);if(Math.floor(t*2+i)%3)P(x,y,1,1,N2)}
  for(let y=0;y<LH;y+=8)P(0,y,LW,1,'#171a38')}
function head(t,t0,s,col=GM){T(s,540,215,{font:'44px PS',fill:col,a:eout(prog(t,t0,t0+.5))})}
function PS(s,x,y,sz,col=WH,a=1,al='center'){T(_s(s),x,y,{font:`${sz}px PS`,fill:col,a,align:al})}
function bg(t){lcBg(t)}
function flush(){ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(LC,0,0,LW*S,LH*S);ctx.restore()}

const SER=(()=>{const r=rng(31);const a=[];let p=60;for(let i=0;i<64;i++){p+=(r()-.5)*5+(i>38?2.2:0)+(i>52?-3.6:0);a.push(p)}return a})();
function priceChart(t,k,opts){ // x 10..125, y 40..150 en píxeles lógicos
  const n=SER.length;const mn=Math.min(...SER)-4,mx=Math.max(...SER)+6;const fx=i=>12+i/(n-1)*110,fy=v=>150-(v-mn)/(mx-mn)*100;
  const pts=SER.map((v,i)=>[fx(i),fy(v)]);
  P(10,150,115,1,GY);P(10,48,1,103,GY);
  if(opts.upper){const w=opts.upper;const up=[];for(let i=w;i<n;i++){const m=Math.max(...SER.slice(i-w,i));up.push([fx(i),fy(m)])}pxLine(up,YL,Math.min(1,k*1.3),1)}
  if(opts.lower){const w=opts.lower;const lo=[];for(let i=w;i<n;i++){const m=Math.min(...SER.slice(i-w,i));lo.push([fx(i),fy(m)])}pxLine(lo,RD,Math.min(1,k*1.3),1)}
  pxLine(pts,GL,k,2);return {fx,fy,pts}}

  PS('cifra reportada, el total varía',540,1180,26,GY,eout(prog(t,41.8,42.6)));PS('sin verificación oficial',540,1240,26,RD,eout(prog(t,42.2,43)));ctx.restore()}
function b6(t,a){ctx.save();ctx.globalAlpha=a;head(t,43.8,'LA LECCIÓN');
  ctx.restore();ctx.save();ctx.globalAlpha=a;
  [['REGLAS CLARAS',GM],['TAMAÑO POR RIESGO',YL],['DISCIPLINA',BL]].forEach(([s,c],i)=>{const k=eout(prog(t,44.6+i*1.1,45.3+i*1.1));if(k<=.02)return;ctx.save();ctx.globalAlpha=a*k;ctx.fillStyle=c;ctx.fillRect(80,320+i*120-36,56,56);PS('+',108,320+i*120-6,34,NV,1);PS(s,170,320+i*120-6,32,WH,1,'left');ctx.restore()});

function draw(t){bg(t);
  // dibujar escenas en baja resolución primero, luego volcar
  let a;
  a=fade(t,0,6.0);if(t<.3)a=1;
  if(a>0){ctx.save();ctx.globalAlpha=a;ctx.restore()}
  // pixeles de cada bloque
  L.save();
  const scenes=[[0,6.0,'h0'],[6.4,13.4,'b1'],[13.6,20.4,'b2'],[20.6,28.2,'b3'],[28.4,35.0,'b4'],[35.2,43.4,'b5'],[43.6,49.6,'b6'],[49.8,55.9,'ou']];
  const act=scenes.find(([s,e])=>t>=s&&t<e);
  const fns={h0,b1,b2,b3,b4,b5,b6,ou:outro};
  if(!act)flush();
  if(act){const [s,e,k]=act;const al=k=='h0'&&t<.3?1:fade(t,s,e);
