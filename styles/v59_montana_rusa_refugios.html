function bg(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1b3a');g.addColorStop(.7,'#3a2a6b');g.addColorStop(1,'#a8486a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

function mkPath(P){const L=[0];for(let i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));return {P,L,tot:L[L.length-1]}}
function at(pa,u){const d=clamp(u)*pa.tot;let i=1;while(i<pa.L.length-1&&pa.L[i]<d)i++;const a=pa.P[i-1],b=pa.P[i];const k=(d-pa.L[i-1])/((pa.L[i]-pa.L[i-1])||1);return [lerp(a[0],b[0],k),lerp(a[1],b[1],k),Math.atan2(b[1]-a[1],b[0]-a[0])]}
function smooth(P,n=6){const o=[];for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];for(let s=0;s<n;s++){const t=s/n,t2=t*t,t3=t2*t;o.push([.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)])}}o.push(P[P.length-1]);return o}
