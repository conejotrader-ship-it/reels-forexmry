function mkSeries(f,N){const r=rng(5);const H_=[],L_=[];for(let i=0;i<N;i++){const c=f(i)+(r()-.5)*2.4;H_.push(c+1.8+r()*1.6);L_.push(c-1.8-r()*1.6)}return [H_,L_]}
function psar(h,l){const n=h.length,sar=[],up=[];let u=true,s=l[0],ep=h[0],af=.02;sar[0]=s;up[0]=true;
  for(let i=1;i<n;i++){s=s+af*(ep-s);
    if(u){s=Math.min(s,l[i-1],i>1?l[i-2]:l[i-1]);if(l[i]<s){u=false;s=ep;ep=l[i];af=.02}else if(h[i]>ep){ep=h[i];af=Math.min(af+.02,.2)}}
    else{s=Math.max(s,h[i-1],i>1?h[i-2]:h[i-1]);if(h[i]>s){u=true;s=ep;ep=h[i];af=.02}else if(l[i]<ep){ep=l[i];af=Math.min(af+.02,.2)}}
    sar[i]=s;up[i]=u}return [sar,up]}
