const HZ=1000;
function bg(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#14012e');g.addColorStop(.52,'#2a0746');g.addColorStop(.53,'#07030f');g.addColorStop(1,'#07030f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

function neon(s,x,y,font,col,a=1,sc=1){T(s,x,y,{font,fill:'#fff',glow:col,gb:34,a,scale:sc});T(s,x,y,{font,fill:col,glow:col,gb:10,a:a*.55,scale:sc})}
