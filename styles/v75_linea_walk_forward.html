function L(s,x,y,sz,col=TX,a=1,al='left'){lbl(s,x,y,sz,col,a,al)}

function curve(p,x0,y0,w,h,t,t0,t1,col,lw=9,floor=true,upto=1){ // p: valores 0..1 (alto), dibuja progresivamente
  const k=eio(prog(t,t0,t1))*upto;const n=p.length-1;const f=k*n;const pts=[];
  for(let i=0;i<=n;i++){const g=clamp(f-(i-1));if(i>0&&g<=0)break;const xa=x0+w*(i/n);const ya=y0+h*(1-p[i]);if(i==0)pts.push([xa,ya]);else{const xp=x0+w*((i-1)/n),yp=y0+h*(1-p[i-1]);pts.push([lerp(xp,xa,g),lerp(yp,ya,g)])}}
  if(pts.length<2)return;ctx.save();
  if(floor){ctx.beginPath();ctx.moveTo(pts[0][0],y0+h);pts.forEach(q=>ctx.lineTo(q[0],q[1]));ctx.lineTo(pts[pts.length-1][0],y0+h);ctx.closePath();const g=ctx.createLinearGradient(0,y0,0,y0+h);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');ctx.fillStyle=g;ctx.fill()}
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowColor=col;ctx.shadowBlur=14;ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();ctx.restore();return pts[pts.length-1]}
