<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:800;src:url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:900;src:url(node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2)}
@font-face{font-family:Orbitron;font-weight:900;src:url(node_modules/@fontsource/orbitron/files/orbitron-latin-900-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block;width:1080px;height:1920px}
</style></head><body><canvas id="c"></canvas><script src="common.js"></script><script>
// Estilo: dashboard (tarjetas, KPIs, medidor) — tema: qué es una cuenta cent
const SPEC={name:'CuentaCent',hook:'¿Y SI OPERAS CON CENTAVOS?',bpm:104,prog:[[57,'m'],[53,'M'],[60,'M'],[55,'M']],
 ev:[[0.3,'hit'],[3.3,'blip',880],[4.6,'tick'],[5.8,'ding'],[7.9,'blip',660],[9.6,'rise',1.2],[11.2,'ding'],[12.4,'alert'],[14.2,'tick'],[15.4,'tick'],[17.2,'cta']],
 subs:[[0.2,3.0,'¿Y si operas con centavos en vez de dólares? Eso es una cuenta cent.'],
 [3.2,7.6,'Tu saldo se muestra en centavos: cien centavos equivalen a un dólar.'],
 [7.9,12.0,'Las operaciones son más pequeñas, así que cada una arriesga menos mientras aprendes.'],
 [12.3,16.9,'Pero es dinero real: puedes perder, y las condiciones cambian según el bróker.'],
 [17.2,20.8,'Securus Apex. Link en bio.']]};
const BG='#0b1220',CARD='#142038',LN='#25365a',TX='#e8f0ff',MU='#8ea3c7',CY='#22d3ee',OR='#ffb020',RD='#ff5470',GR='#34d399';
const STY={subFont:'800 46px Inter',subBg:'rgba(11,18,32,.94)',subStroke:CY,subFill:TX,ctaBg:'#0b1220',ctaSub:CY,ctaGlow:CY,
 ctaAccent:OR,ctaBtnText:'#0b1220',ctaFontS:'800 52px Inter',ctaFontL:'900 110px Inter'};
boot(['800 40px Inter','900 40px Inter','900 40px Orbitron']);
function bg(){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(34,211,238,.06)';ctx.lineWidth=2;
  for(let x=0;x<W;x+=60)line(x,0,x,H,'rgba(34,211,238,.06)',2);for(let y=0;y<H;y+=60)line(0,y,W,y,'rgba(34,211,238,.06)',2);
  RR(60,70,960,70,20);ctx.fillStyle=CARD;ctx.fill();['#ff5470','#ffb020','#34d399'].forEach((c,i)=>{ctx.beginPath();ctx.arc(110+i*40,105,12,0,7);ctx.fillStyle=c;ctx.fill()});
  T('PANEL DE CUENTA',620,105,{font:'800 30px Inter',fill:MU})}
function card(x,y,w,h,k=1,bd=LN){if(k<=0)return;ctx.save();ctx.translate(x+w/2,y+h/2+(1-k)*40);ctx.globalAlpha*=clamp(k);ctx.translate(-x-w/2,-y-h/2);
  RR(x,y,w,h,32);ctx.fillStyle=CARD;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=bd;ctx.stroke();ctx.restore()}
function lab(s,x,y,col=MU,sz=34,al='left'){T(s,x,y,{font:`800 ${sz}px Inter`,fill:col,align:al})}
function big(s,x,y,sz,col,al='center',glow){T(s,x,y,{font:`900 ${sz}px Orbitron`,fill:col,align:al,glow,gb:20})}
function fade(t,a,b){return Math.min(prog(t,a,a+.3),1-prog(t,b-.25,b))}
function fmt(n,d=0){return n.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d})}
function gauge(cx,cy,r,v,col){ctx.save();ctx.lineWidth=44;ctx.lineCap='round';ctx.strokeStyle=LN;ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,2*Math.PI);ctx.stroke();
  ctx.strokeStyle=col;ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,Math.PI+Math.PI*v);ctx.stroke();ctx.restore()}
function draw(t){bg();
  // Gancho
  let a=1-prog(t,2.7,3.2);if(t<3.3){ctx.save();ctx.globalAlpha=a;const k=eout(prog(t,.1,.7));
    card(70,300,940,1000,k,CY);
    ctx.save();ctx.globalAlpha=a*k;T('¿Y SI OPERAS',540,520,{font:'900 92px Inter',fill:TX});
    T('CON CENTAVOS?',540,640,{font:'900 92px Inter',fill:OR});
    const v=Math.round(eio(prog(t,.6,2.2))*100);big(String(v)+' ¢',540,880,150,CY,'center',CY);
    big('= $1',540,1050,110,GR,'center',GR);
    lab('CUENTA CENT',540,1200,MU,40,'center');ctx.restore();ctx.restore()}
  // Tarjeta 1: saldo en centavos
  a=fade(t,3.2,7.7);if(a>0){ctx.save();ctx.globalAlpha=a;
    card(70,230,940,420,eout(prog(t,3.2,3.8)));
    lab('SALDO (EJEMPLO)',120,300,MU,36);
    const n=Math.round(eio(prog(t,3.8,5.0))*5000);big(fmt(n)+' ¢',540,440,120,CY,'center',CY);
    lab('ejemplo ilustrativo',540,590,MU,32,'center');
    card(70,700,940,380,eout(prog(t,4.8,5.4)));
    lab('CONVERSIÓN',120,770,MU,36);
    const k=prog(t,5.4,6.4);big(fmt(Math.round(eio(k)*100))+' ¢',300,920,90,CY,'center');
    ctx.save();ctx.strokeStyle=MU;ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(470,920);ctx.lineTo(590,920);ctx.moveTo(555,890);ctx.lineTo(590,920);ctx.lineTo(555,950);ctx.stroke();ctx.restore();
    big('$ 1',780,920,100,GR,'center',GR);
    lab('cien centavos = un dólar',540,1020,TX,38,'center');
    ctx.restore()}
  // Tarjeta 2: operaciones más pequeñas
  a=fade(t,7.9,12.1);if(a>0){ctx.save();ctx.globalAlpha=a;
    card(70,230,940,820,eout(prog(t,7.9,8.5)));
    lab('TAMAÑO DE LA OPERACIÓN (EJEMPLO)',120,300,MU,32);
    lab('Cuenta estándar',120,420,TX,40);RR(120,460,820,70,18);ctx.fillStyle=LN;ctx.fill();
    RR(120,460,820*eout(prog(t,8.6,9.6)),70,18);ctx.fillStyle=RD;ctx.fill();
    lab('Cuenta cent',120,640,TX,40);RR(120,680,820,70,18);ctx.fillStyle=LN;ctx.fill();
    RR(120,680,Math.max(10,820*.08*eout(prog(t,9.6,10.6))),70,18);ctx.fillStyle=GR;ctx.fill();
    const c=eback(prog(t,10.6,11.2));if(c>0){ctx.save();ctx.translate(540,900);ctx.scale(c,c);RR(-380,-60,760,120,60);ctx.fillStyle='rgba(52,211,153,.15)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=GR;ctx.stroke();
      T('MENOS RIESGO POR OPERACIÓN',0,3,{font:'900 38px Inter',fill:GR});ctx.restore()}
    ctx.restore()}
  // Tarjeta 3: advertencia dinero real
  a=fade(t,12.3,17.0);if(a>0){ctx.save();ctx.globalAlpha=a;
    card(70,230,940,420,eout(prog(t,12.3,12.9)),RD);
    const s=eback(prog(t,12.6,13.2));ctx.save();ctx.translate(540,325);ctx.scale(s,s);RR(-280,-55,560,110,55);ctx.fillStyle=RD;ctx.fill();T('DINERO REAL',0,3,{font:'900 60px Inter',fill:'#fff'});ctx.restore();
    gauge(540,590,120,.35+.45*eio(prog(t,13.2,14.4)),OR);lab('riesgo',540,625,MU,32,'center');
    card(70,700,940,400,eout(prog(t,14.0,14.6)));
    [['Puedes perder dinero',RD,14.4],['Condiciones según el bróker',OR,15.6]].forEach(([s2,col,ts],i)=>{const k=eout(prog(t,ts,ts+.5));ctx.save();ctx.globalAlpha=a*k;
      const y=820+i*150;ctx.beginPath();ctx.arc(150,y,32,0,7);ctx.fillStyle=col;ctx.fill();T('!',150,y+3,{font:'900 44px Inter',fill:BG});lab(s2,215,y,TX,44);ctx.restore()});
    ctx.restore()}
}
function cover(){bg();ctx.save();ctx.translate(0,170);card(70,330,940,900,1,CY);
  T('¿CUENTA CENT?',540,480,{font:'900 92px Inter',fill:TX});
  big('100 ¢ = $1',540,700,100,CY,'center',CY);
  T('¿OPERAR CON',540,880,{font:'900 84px Inter',fill:OR});T('CENTAVOS?',540,990,{font:'900 104px Inter',fill:OR});
  RR(220,1090,640,100,50);ctx.fillStyle=CY;ctx.fill();T('DESCÚBRELO',540,1141,{font:'900 46px Inter',fill:BG});ctx.restore()}
</script></body></html>
