    tx('*ejemplo ilustrativo',540,1130,'#6f879c',26,1,'center');ctx.restore()}

  a=fade(t,7.3,11.3);if(a>0){ctx.save();ctx.globalAlpha=a;win(70,420,940,860,'REGLAS.cfg');
    const k1=eout(prog(t,7.6,8.2)),k2=eout(prog(t,9.2,9.8));

    ctx.globalAlpha=a*k2;RR(110,820,860,240,16);ctx.fillStyle='rgba(242,201,76,.1)';ctx.fill();ctx.strokeStyle=Y;ctx.stroke();

  a=fade(t,11.4,15.1);if(a>0){ctx.save();ctx.globalAlpha=a;win(70,420,940,860,'VERIFICAR.sh');
    tx('$ abrir web del regulador',110,530,G,32,prog(t,11.5,11.8));
    const items=[['buscar el nombre del bróker',11.9],['licencia activa',12.9],['dominio coincide',13.9]];

      ctx.save();ctx.translate(900,y);ctx.scale(c,c);T('✔',0,0,{font:'900 70px Inter',fill:G,glow:G,gb:16});ctx.restore()});
    tx('█',110,1150,G,34,(Math.floor(t*3)%2)?1:0);ctx.restore()}
  // 15.2–17 aviso de riesgo
  a=fade(t,15.2,17.1);if(a>0){ctx.save();ctx.globalAlpha=a;win(90,520,900,560,'AVISO',Y);
    T('REGULADO',540,730,{font:'900 100px Inter',fill:'#fff'});T('≠',540,850,{font:'900 110px Inter',fill:Y});T('SIN RIESGO',540,980,{font:'900 100px Inter',fill:R,glow:R,gb:18});ctx.restore()}
