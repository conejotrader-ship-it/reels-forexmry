<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:800;src:url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:Orbitron;font-weight:700;src:url(node_modules/@fontsource/orbitron/files/orbitron-latin-700-normal.woff2)}
@font-face{font-family:Orbitron;font-weight:900;src:url(node_modules/@fontsource/orbitron/files/orbitron-latin-900-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block;width:1080px;height:1920px}
</style></head><body><canvas id="c"></canvas><script src="common.js"></script><script>
// Estilo: neón synthwave — tema: martingala vs grid
const SPEC={name:'MartingalaGrid',hook:'MARTINGALA VS GRID: ¿CUÁL ARRIESGA MÁS?',bpm:124,prog:[[52,'m'],[48,'M'],[55,'M'],[50,'M']],
 ev:[[0.3,'power'],[2.7,'rise',0.8],[3.4,'seq',[660,880,1320]],[5.4,'tick'],[5.9,'tick'],[6.4,'tick'],[8.2,'chime'],[9.4,'tick'],[10.0,'tick'],[10.6,'tick'],[12.9,'down'],[14.6,'ding'],[17.2,'cta']],
 subs:[[0.2,3.0,'Martingala y grid: dos estrategias que usan los robots, y las dos tienen riesgos.'],
 [3.2,7.6,'Martingala: duplica el lote después de cada pérdida, esperando recuperar todo con una sola ganadora.'],
 [7.8,12.0,'Grid: abre varias órdenes escalonadas, cada cierto número de pips, sin duplicar necesariamente el lote.'],
 [12.2,16.9,'Si el precio sigue en contra, las dos acumulan pérdidas. Define límites de riesgo y prueba primero en demo.'],
 [17.2,20.8,'Securus Apex. Link en bio.']]};
const CY='#28f0ff',MG='#ff2bd6',GD='#ffd23d',RDN='#ff4466';
const STY={subFont:'700 38px Orbitron',subBg:'rgba(10,2,24,.86)',subStroke:'#ff2bd6',subFill:'#eaffff',ctaBg:'#07030f',ctaSub:'#28f0ff',ctaGlow:'#ff2bd6',
 ctaAccent:'#ff2bd6',ctaBtnText:'#fff',ctaFontS:'700 46px Orbitron',ctaFontL:'900 96px Orbitron'};
boot(['700 40px Orbitron','900 40px Orbitron','800 40px Inter']);
const HZ=1000;
function bg(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#14012e');g.addColorStop(.52,'#2a0746');g.addColorStop(.53,'#07030f');g.addColorStop(1,'#07030f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // sol retro
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,HZ);ctx.clip();const sg=ctx.createLinearGradient(0,HZ-300,0,HZ);sg.addColorStop(0,GD);sg.addColorStop(1,MG);ctx.fillStyle=sg;ctx.globalAlpha=.55;
  ctx.beginPath();ctx.arc(540,HZ,300,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#2a0746';for(let i=0;i<7;i++){ctx.fillRect(200,HZ-20-i*38,680,4+i*3)}ctx.restore();
  // piso con perspectiva
  ctx.save();ctx.beginPath();ctx.rect(0,HZ,W,H-HZ);ctx.clip();ctx.strokeStyle=MG;ctx.shadowColor=MG;ctx.shadowBlur=10;ctx.lineWidth=2.5;ctx.globalAlpha=.7;
  for(let i=-14;i<=14;i++){ctx.beginPath();ctx.moveTo(540+i*18,HZ);ctx.lineTo(540+i*180,H);ctx.stroke()}
  const ph=(t*.5)%1;for(let j=0;j<14;j++){const u=(j+ph)/14,y=HZ+Math.pow(u,2.2)*(H-HZ);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();
  ctx.save();ctx.strokeStyle=CY;ctx.shadowColor=CY;ctx.shadowBlur=14;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,HZ);ctx.lineTo(W,HZ);ctx.stroke();ctx.restore()}
function scan(){ctx.save();ctx.globalAlpha=.07;ctx.fillStyle='#000';for(let y=0;y<H;y+=6)ctx.fillRect(0,y,W,3);ctx.restore()}

function neon(s,x,y,font,col,a=1,sc=1){T(s,x,y,{font,fill:'#fff',glow:col,gb:34,a,scale:sc});T(s,x,y,{font,fill:col,glow:col,gb:10,a:a*.55,scale:sc})}
function fade(t,a,b){return Math.min(prog(t,a,a+.35),1-prog(t,b-.3,b))}
function panel(y,h,col,a){ctx.save();ctx.globalAlpha=a;RR(70,y,940,h,28);ctx.fillStyle='rgba(10,2,24,.82)';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=4;ctx.shadowColor=col;ctx.shadowBlur=22;ctx.stroke();ctx.restore()}
function draw(t){bg(t);
  const k=eio(prog(t,2.6,3.5));
  if(k<1){const sc=1+.2*k,a=1-k;
    neon('MARTINGALA',540,470,'900 100px Orbitron',MG,a,sc);neon('VS',540,620,'900 110px Orbitron',GD,a,sc);neon('GRID',540,800,'900 190px Orbitron',CY,a,sc);neon('¿CUÁL ARRIESGA MÁS?',540,960,'900 50px Orbitron','#fff',a,sc)}
  if(k>0)neon('MARTINGALA · GRID',540,300,'900 56px Orbitron',CY,k);
  // martingala: lotes que se duplican
  let a=fade(t,3.2,7.7);if(a>0){panel(400,860,MG,a);ctx.save();ctx.globalAlpha=a;
    neon('MARTINGALA',540,480,'900 56px Orbitron',MG,a);
    [1,2,4,8].forEach((v,i)=>{const kk=eout(prog(t,4.3+i*.55,4.9+i*.55));const h=v*68*kk,x=170+i*200;
      ctx.fillStyle=i==0?CY:RDN;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;ctx.fillRect(x,1130-h,150,h);ctx.shadowBlur=0;
      T('x'+v,x+75,1130+34,{font:'900 38px Orbitron',fill:'#fff',a:kk});
      if(i>0)T('✕2',x-25,1130-h-30,{font:'900 34px Orbitron',fill:GD,a:kk})});
    T('lote ilustrativo tras cada pérdida',540,1215,{font:'700 28px Orbitron',fill:'#c9f7ff',a:prog(t,6.6,7.1)});ctx.restore()}
  // grid: órdenes escalonadas
  a=fade(t,7.8,12.1);if(a>0){panel(400,860,CY,a);ctx.save();ctx.globalAlpha=a;
    neon('GRID',540,480,'900 56px Orbitron',CY,a);
    for(let i=0;i<5;i++){const kk=eout(prog(t,8.6+i*.55,9.2+i*.55));const y=600+i*135;
      ctx.globalAlpha=a*kk;line(180,y,900,y,'rgba(40,240,255,.5)',3,[12,10]);
      ctx.beginPath();ctx.arc(300+i*0,y,26,0,7);ctx.fillStyle=GD;ctx.shadowColor=GD;ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;
      T('orden '+(i+1),640,y-30,{font:'700 30px Orbitron',fill:'#c9f7ff',align:'left'})}
    ctx.globalAlpha=a*prog(t,11.0,11.6);T('mismo lote · cada X pips',540,1245,{font:'700 30px Orbitron',fill:'#c9f7ff'});ctx.restore()}
  // riesgo
  a=fade(t,12.2,17.1);if(a>0){panel(420,820,RDN,a);ctx.save();ctx.globalAlpha=a;
    neon('RIESGO EN LAS DOS',540,520,'900 50px Orbitron',RDN,a);
    const pts=[];for(let i=0;i<=40;i++){const x=150+i*19;pts.push([x,640+i*i*.27+Math.sin(i*.9)*18])}
    const n=Math.floor(40*eout(prog(t,12.6,15)));ctx.strokeStyle=RDN;ctx.lineWidth=7;ctx.shadowColor=RDN;ctx.shadowBlur=18;ctx.beginPath();pts.slice(0,n+1).forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.shadowBlur=0;
    T('precio en contra → pérdidas acumuladas',540,1135,{font:'700 28px Orbitron',fill:'#fff',a:prog(t,14,14.6)});
    T('LÍMITES + DEMO',540,1195,{font:'900 56px Orbitron',fill:GD,a:prog(t,15.3,15.9),glow:GD,gb:24});ctx.restore()}
  scan()}
function cover(){bg(3);ctx.save();ctx.translate(0,40);
  neon('MARTINGALA',540,430,'900 108px Orbitron',MG);neon('VS',540,590,'900 100px Orbitron',GD);neon('GRID',540,790,'900 230px Orbitron',CY);
  neon('¿CUÁL ARRIESGA MÁS?',540,980,'900 54px Orbitron','#fff');
  RR(210,1070,660,110,55);ctx.fillStyle=GD;ctx.shadowColor=GD;ctx.shadowBlur=26;ctx.fill();ctx.shadowBlur=0;T('DESCÚBRELO →',540,1126,{font:'900 42px Orbitron',fill:'#1a0a00'});
  ctx.restore();scan()}
</script></body></html>
