function bg(t){ctx.fillStyle=BL;ctx.fillRect(0,0,W,H);ctx.save();ctx.strokeStyle='rgba(127,227,255,.14)';ctx.lineWidth=2;for(let x=0;x<=W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
