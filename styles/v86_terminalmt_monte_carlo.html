function M(s,x,y,sz,col=TX,a=1,al='center'){T(_s(s),x,y,{font:`${Math.round(sz*1.15)}px SM`,fill:col,a,align:al})}
function B(s,x,y,sz,col=TX,a=1,al='center'){T(_s(s),x,y,{font:`900 ${sz}px Inter`,fill:col,a,align:al})}
// simulación determinista
const NT=70;const TR=(()=>{const r=rng(7);const a=[];for(let i=0;i<NT;i++){a.push((r()<.55?1:-.85)*(.6+r()*.8)*100)}return a})();
function perm(seed){const r=rng(seed*97+5);const a=TR.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function curve(a){const c=[0];let s=0;for(const v of a){s+=v;c.push(s)}return c}
function maxDD(c){let pk=-1e9,dd=0;for(const v of c){pk=Math.max(pk,v);dd=Math.max(dd,pk-v)}return dd}
const CUR=[];for(let i=0;i<140;i++)CUR.push(i==0?curve(TR):curve(perm(i)));
const DDS=CUR.map(maxDD);const SORT=DDS.slice(1).sort((a,b)=>a-b);const P95=SORT[Math.floor(SORT.length*.95)];
let CMIN=1e9,CMAX=-1e9;CUR.forEach(c=>c.forEach(v=>{CMIN=Math.min(CMIN,v);CMAX=Math.max(CMAX,v)}));
const CX=90,CY=360,CW=900,CH=680;
const fx=i=>CX+i/NT*CW,fy=v=>CY+CH-(v-CMIN)/(CMAX-CMIN)*CH;

  // barra de título de plataforma
  ctx.fillStyle=PN;ctx.fillRect(0,0,W,120);ctx.fillStyle=LN;ctx.fillRect(0,120,W,3);
  ['#ff5f57','#febc2e','#28c840'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(46+i*40,60,13,0,7);ctx.fill()});
  M('MetaTrader · Informe del Probador · Monte Carlo',620,60,26,TX,1);
  ctx.fillStyle=PN2;ctx.fillRect(0,123,W,64);['Resultados','Gráfico','Monte Carlo','Diario'].forEach((s,i)=>{const act=i==2;ctx.fillStyle=act?BG:PN2;ctx.fillRect(20+i*250,130,235,57);M(s,137+i*250,160,26,act?GR:DM,1)})}
function panel(x,y,w,h,k=1){ctx.save();ctx.globalAlpha*=k;ctx.fillStyle=PN;ctx.fillRect(x,y,w,h);ctx.strokeStyle=LN;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);ctx.restore()}
function grid(){ctx.save();ctx.strokeStyle=LN;ctx.lineWidth=1;ctx.globalAlpha*=.8;for(let i=0;i<=5;i++){ctx.beginPath();ctx.moveTo(CX,CY+CH*i/5);ctx.lineTo(CX+CW,CY+CH*i/5);ctx.stroke()}for(let i=0;i<=6;i++){ctx.beginPath();ctx.moveTo(CX+CW*i/6,CY);ctx.lineTo(CX+CW*i/6,CY+CH);ctx.stroke()}ctx.restore()}
function drawCurve(c,col,lw,al,k=1){ctx.save();ctx.globalAlpha*=al;ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.beginPath();const n=Math.floor(k*(c.length-1));for(let i=0;i<=n;i++){const x=fx(i),y=fy(c[i]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}if(k<1&&n<c.length-1){const g=k*(c.length-1)-n;ctx.lineTo(lerp(fx(n),fx(n+1),g),lerp(fy(c[n]),fy(c[n+1]),g))}ctx.stroke();ctx.restore()}
function head(t,t0,s,col=GR){M(s,540,250,52,col,eout(prog(t,t0,t0+.5)))}
function fan(t,a,n,k,hi){for(let i=1;i<n;i++)drawCurve(CUR[i],BL,2,.22*(n>60?.7:1),k);if(hi)hi();drawCurve(CUR[0],GO,6,1,k)}
function h0(t,a){ctx.save();ctx.globalAlpha=a;

function b3(t,a){ctx.save();ctx.globalAlpha=a;head(t,20.8,'PERCENTIL 95',RD);

  const mn=Math.min(...DDS.slice(1)),mx=Math.max(...DDS.slice(1));const bins=18,h=new Array(bins).fill(0);DDS.slice(1).forEach(v=>{h[Math.min(bins-1,Math.floor((v-mn)/(mx-mn+1e-9)*bins))]++});const hm=Math.max(...h);

function b4(t,a){ctx.save();ctx.globalAlpha=a;head(t,28.6,'EJEMPLO DE LA FUENTE',GO);
