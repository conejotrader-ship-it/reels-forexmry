// Estilo: billete verde y crema con guilloche — tema: Acuerdo del Plaza, 22 de septiembre de 1985

const GR='#0e2b1f',GR2='#164431',CR='#f1e8cf',GD='#d9b24c',RD='#e2553f',MT='#8fb59f',INK='#0a1a12';

function bg(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,GR);g.addColorStop(1,GR2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

function fade(t,a,b){return Math.min(prog(t,a,a+.35),1-prog(t,b-.3,b))}

// gráfico ilustrativo del dólar: sube hasta el pico (1985) y cae después
const CX0=150,CX1=930,PK=600,BASE=1060,TOP=560; // PK = x del pico
function yAt(x){ // curva ilustrativa
  if(x<=PK){const k=(x-CX0)/(PK-CX0);return lerp(BASE,TOP,Math.pow(k,1.25))+Math.sin(x*.07)*7*k}
  const k=(x-PK)/(CX1-PK);return lerp(TOP,BASE-120,eio(Math.min(1,k*1.05)))+Math.sin(x*.09)*6}
function chart(t,a,mode){
  ctx.save();ctx.globalAlpha=a;panel(70,380,940,780);
  T('DÓLAR · ILUSTRATIVO',150,440,{font:'800 36px Inter',fill:CR,align:'left'});
  T('1980 → 1987',930,440,{font:'800 30px Inter',fill:MT,align:'right'});

    const k2=eout(prog(t,7.0,7.6));if(k2>0)T('frente a yen, marco, franco y libra',540,BASE+120,{font:'800 28px Inter',fill:MT,a:k2})}
  if(mode==2){
    const kDn=prog(t,13.8,16.2);const xDn=PK+(CX1-PK)*eout(kDn);
    ctx.save();ctx.strokeStyle=RD;ctx.lineWidth=8;ctx.shadowColor=RD;ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(PK,yAt(PK));
    for(let x=PK;x<=xDn;x+=8)ctx.lineTo(x,yAt(x));ctx.stroke();ctx.restore();
    const k=eback(prog(t,14.3,14.9));if(k>0){RR(150,TOP+10,290,120,22);ctx.fillStyle='rgba(226,85,63,.16)';ctx.fill();ctx.strokeStyle=RD;ctx.lineWidth=4;ctx.stroke();
      T('−4%',295,TOP+60,{font:'900 76px Inter',fill:RD,scale:k});T('el lunes siguiente',295,TOP+108,{font:'800 24px Inter',fill:CR,a:k})}
    const k3=eout(prog(t,15.6,16.2));if(k3>0){line(CX1-60,yAt(CX1)-190,CX1-60,yAt(CX1)+20,GD,3,[12,8]);T('1987 · LOUVRE: frenar la caída',540,BASE+120,{font:'800 30px Inter',fill:GD,a:k3})}}
  // marca del pico
  const kp=mode==1?prog(t,6.9,7.3):1;if(kp>0){ctx.beginPath();ctx.arc(PK,yAt(PK),12,0,7);ctx.fillStyle=CR;ctx.globalAlpha=a*kp;ctx.fill()}
  ctx.restore()}

    ctx.beginPath();ctx.arc(176+dx,y+46,22,0,7);ctx.fillStyle=GD;ctx.fill();T(String(i+1),176+dx,y+47,{font:'900 28px Inter',fill:INK});
    T(n,225+dx,y+47,{font:'800 38px Inter',fill:CR,align:'left'});ctx.restore()});

}
