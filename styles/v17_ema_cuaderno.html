function walk(seed,segs,start){const R=rng(seed);let v=start;const o=[v];for(const [n,dr,vol] of segs){for(let i=0;i<n;i++){v+=dr+(R()-.5)*2*vol;o.push(v)}}return o}
function ema(S,n){const k=2/(n+1),e=[S[0]];for(let i=1;i<S.length;i++)e.push(S[i]*k+e[i-1]*(1-k));return e}
function sma(S,n){return S.map((_,i)=>{const a=Math.max(0,i-n+1);let s=0;for(let j=a;j<=i;j++)s+=S[j];return s/(i-a+1)})}
function cdl(S,seed,vol){const R=rng(seed);return S.map((c,i)=>{const o=i?S[i-1]:c-.3;return{o,c,h:Math.max(o,c)+R()*vol,l:Math.min(o,c)-R()*vol}})}
function crosses(f,s,from){const o=[];for(let i=Math.max(1,from);i<f.length;i++){const a=f[i-1]-s[i-1],b=f[i]-s[i];if(a<=0&&b>0)o.push({i,d:'up'});else if(a>=0&&b<0)o.push({i,d:'dn'})}return o}

 const n=S.length,cd=o.candles?cdl(S,o.seed||1,o.vol||1.2):null;let lo=1e9,hi=-1e9;
