function mkCurves(seed,common,n=3,len=60){const r=rng(seed);const base=[];for(let i=0;i<len;i++)base.push((r()-.5)*2);const out=[];for(let c=0;c<n;c++){const rr=rng(seed*7+c*13+1);let v=0;const p=[];for(let i=0;i<len;i++){v+=common*base[i]+(1-common)*((rr()-.5)*2)+.12;p.push(v)}out.push(p)}return out}
function norm(cs){let lo=1e9,hi=-1e9;cs.forEach(p=>p.forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v)}));return cs.map(p=>p.map((v,i)=>[i/(p.length-1),(v-lo)/(hi-lo)]))}
