</style></head><body><canvas id="c"></canvas><script src="common.js"></script><script>
// Estilo: infografía — tema: take profit fijo vs dinámico
const SPEC={name:'TakeProfit',hook:'¿TAKE PROFIT FIJO O DINÁMICO?',bpm:112,prog:[[60,'M'],[55,'M'],[57,'m'],[53,'M']],
 ev:[[0.3,'blip',660],[2.6,'rise',0.8],[3.4,'chime'],[5.2,'tick'],[7.8,'chime'],[9.6,'tick'],[12.2,'chime'],[14.0,'seq',[523,659,784]],[17.2,'cta']],

 [3.2,7.4,'Fijo: sales en un precio o una distancia definidos de antemano. Es simple y predecible.'],
 [7.7,11.8,'Dinámico: el objetivo se ajusta, por ejemplo con un trailing stop o según la volatilidad.'],
 [12.1,16.8,'Ninguno es perfecto. Pruébalos en demo y compara los resultados.'],
 [17.2,20.8,'Securus Apex. Link en bio.']]};
const GOLD='#ffc83d',RED='#ff5a5f',GRN='#2ee6a6';
const STY={subFont:'800 46px Inter',subBg:'rgba(6,14,40,.86)',subStroke:'#ffc83d',ctaBg:'#0b1b44',ctaSub:'#ffc83d',ctaGlow:'#ffc83d',

boot(['700 40px Inter','800 40px Inter','900 40px Inter']);
function bg(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1b44');g.addColorStop(1,'#1b3a8f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.07;ctx.fillStyle='#fff';for(let i=-4;i<14;i++){ctx.save();ctx.translate(i*150+(t*20)%150,0);ctx.rotate(.35);ctx.fillRect(0,-200,40,2400);ctx.restore()}ctx.restore()}
const CARDS=[{ts:3.4,y:470,n:'1',h:'FIJO',s:'Objetivo definido de antemano'},
 {ts:7.8,y:790,n:'2',h:'DINÁMICO',s:'El objetivo se ajusta al precio'},
 {ts:12.2,y:1110,n:'3',h:'PRUEBA EN DEMO',s:'Compara ambos antes de usar dinero real'}];
function diag(i,x,y,w,h,t,ts){const k=prog(t,ts+.4,ts+1.9);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  if(i==0){const ty=y+h*.2;line(x,ty,x+w,ty,GRN,5,[12,8]);T('TP',x+14,ty+22,{font:'900 28px Inter',fill:GRN,align:'left'});
    const pts=[[0,.9],[.2,.6],[.35,.7],[.55,.4],[.75,.22],[1,.2]];ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();
    const n=Math.floor(k*(pts.length-1));for(let j=0;j<=n;j++){const [px,py]=pts[j];j?ctx.lineTo(x+px*w,y+py*h):ctx.moveTo(x+px*w,y+py*h)}ctx.stroke();
    if(k>.95)T('✓',x+w-30,y+h-34,{font:'900 56px Inter',fill:GRN})}
  if(i==1){const pts=[[0,.85],[.2,.65],[.4,.5],[.6,.3],[.8,.18],[1,.3]];ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();
    const n=Math.floor(k*(pts.length-1));for(let j=0;j<=n;j++){const [px,py]=pts[j];j?ctx.lineTo(x+px*w,y+py*h):ctx.moveTo(x+px*w,y+py*h)}ctx.stroke();
    ctx.strokeStyle=GOLD;ctx.lineWidth=5;ctx.setLineDash([10,8]);ctx.beginPath();
    for(let j=0;j<=n;j++){const [px,py]=pts[j];const yy=Math.max(py,.18)+.18;j?ctx.lineTo(x+px*w,y+Math.min(yy,.95)*h):ctx.moveTo(x+px*w,y+Math.min(yy,.95)*h)}ctx.stroke();ctx.setLineDash([]);
    T('sigue al precio',x+w/2,y+h-14,{font:'800 26px Inter',fill:GOLD})}
  if(i==2){const a=eout(prog(t,ts+.4,ts+1.0)),b=eout(prog(t,ts+1.0,ts+1.6));
    RR(x,y+h*.2,w*.4,h*.4,16);ctx.fillStyle=GOLD;ctx.globalAlpha=a;ctx.fill();T('FIJO',x+w*.2,y+h*.4,{font:'900 32px Inter',fill:'#0b1b44',a:a});
    ctx.globalAlpha=b;T('vs',x+w*.5,y+h*.4,{font:'900 36px Inter',fill:'#fff'});
    RR(x+w*.6,y+h*.2,w*.4,h*.4,16);ctx.fillStyle=GRN;ctx.fill();T('DINÁM.',x+w*.8,y+h*.4,{font:'900 28px Inter',fill:'#06241b',a:b});

  ctx.restore()}
function card(c,i,t,active){const k=eback(prog(t,c.ts,c.ts+.5));if(k<=0)return;const ox=(1-k)*900;ctx.save();ctx.translate(ox,0);ctx.globalAlpha=Math.min(1,prog(t,c.ts,c.ts+.2))*(active?1:.78);
  RR(100,c.y,880,300,30);ctx.fillStyle='rgba(8,18,52,.88)';ctx.fill();ctx.strokeStyle=active?GOLD:'rgba(255,255,255,.25)';ctx.lineWidth=active?6:3;ctx.stroke();
  ctx.beginPath();ctx.arc(190,c.y+80,52,0,7);ctx.fillStyle=GOLD;ctx.fill();T(c.n,190,c.y+84,{font:'900 64px Inter',fill:'#0b1b44'});
  T(c.h,270,c.y+62,{font:'900 50px Inter',fill:'#fff',align:'left'});
  wrapLines(c.s,380,'700 32px Inter').forEach((l,j)=>T(l,140,c.y+160+j*44,{font:'700 32px Inter',fill:'#c8d6ff',align:'left'}));
  ctx.restore();ctx.save();ctx.translate(ox,0);diag(i,640,c.y+95,320,190,t,c.ts);ctx.restore()}
function draw(t){bg(t);
  const k=eio(prog(t,2.6,3.5));
  if(k<1){T('¿TAKE PROFIT',540,780,{font:'900 112px Inter',fill:'#fff',a:1-k,scale:1+.25*k});T('FIJO O',540,930,{font:'900 120px Inter',fill:GOLD,a:1-k,scale:1+.25*k});T('DINÁMICO?',540,1090,{font:'900 150px Inter',fill:GOLD,a:1-k,scale:1+.25*k,glow:'#ffc83d',gb:30});
    T('dos formas de cerrar en ganancia',540,1230,{font:'800 44px Inter',fill:'#c8d6ff',a:(1-k)*eout(prog(t,.8,1.6))})}
  if(k>0){T('TAKE PROFIT',540,290,{font:'900 110px Inter',fill:GOLD,a:k,glow:'#ffc83d',gb:24});T('fijo vs dinámico',540,385,{font:'800 46px Inter',fill:'#fff',a:k})}
  const act=t>=12.2?2:(t>=7.8?1:0);
  CARDS.forEach((c,i)=>{if(t>=3.4)card(c,i,t,i===act)})}
function cover(){bg(2);ctx.save();ctx.translate(0,40);
  RR(120,480,840,190,40);ctx.fillStyle=GOLD;ctx.fill();

  T('FIJO O',540,790,{font:'900 150px Inter',fill:'#fff',stroke:'#0b1b44',lw:16,glow:'#ffc83d',gb:30});
  T('DINÁMICO?',540,990,{font:'900 150px Inter',fill:GOLD,stroke:'#0b1b44',lw:14});
  RR(220,1120,640,110,55);ctx.fillStyle=RED;ctx.fill();T('ELIGE · MÍRALO',540,1175,{font:'900 44px Inter',fill:'#fff'});ctx.restore()}
