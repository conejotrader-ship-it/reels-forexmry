<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:700;src:url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:900;src:url(node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block;width:1080px;height:1920px}
</style></head><body><canvas id="c"></canvas><script src="common.js"></script><script>
// Estilo: velas animadas (paleta carbón/cian) — tema: cómo leer una vela japonesa
const SPEC={name:'VelaJaponesa',hook:'¿SABES LEER UNA VELA JAPONESA?',bpm:104,prog:[[55,'m'],[51,'M'],[58,'M'],[53,'M']],
 ev:[[0.2,'rise',2.6],[3.2,'blip',880],[4.4,'tick'],[5.6,'tick'],[8.0,'blip',660],[9.2,'tick'],[10.4,'tick'],[12.3,'chime'],[14.5,'blip',523],[15.5,'chime'],[17.2,'cta']],
 subs:[[0.2,3.0,'¿Sabes leer una vela japonesa? Va en 20 segundos.'],
 [3.2,7.6,'Cada vela resume un período: apertura, cierre, máximo y mínimo.'],
 [7.8,12.0,'El cuerpo va de la apertura al cierre. Las mechas muestran los extremos.'],
 [12.2,16.9,'Verde: cerró arriba de donde abrió. Roja: cerró abajo. Una sola vela no predice nada.'],
 [17.2,20.8,'Securus Apex. Link en bio.']]};
const STY={subFont:'800 46px Inter',subBg:'rgba(10,14,20,.88)',subStroke:'#22d3ee',ctaBg:'#0a0e14',ctaSub:'#22d3ee',ctaGlow:'#22d3ee',
 ctaAccent:'#22d3ee',ctaBtnText:'#0a0e14',ctaFontS:'800 52px Inter',ctaFontL:'900 110px Inter'};
boot(['700 40px Inter','800 40px Inter','900 40px Inter']);
const BG='#0a0e14',GR='#22c55e',RD='#ef4444',CY='#22d3ee';
function bg(){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(540,800,50,540,800,1100);g.addColorStop(0,'#16202e');g.addColorStop(1,BG);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.07;for(let y=300;y<1500;y+=100)line(60,y,1020,y,'#fff',1);ctx.restore()}
function candle(x,w,hi,o,c,lo,col,k,a=1){ // k 0..1 crecimiento
  ctx.save();ctx.globalAlpha=a;const m=(hi+lo)/2;const f=v=>m+(v-m)*k;
  line(x,f(hi),x,f(lo),col,6);ctx.fillStyle=col;const yo=f(o),yc=f(c);ctx.fillRect(x-w/2,Math.min(yo,yc),w,Math.max(6,Math.abs(yo-yc)));ctx.restore()}
function fade(t,a,b){return Math.min(prog(t,a,a+.35),1-prog(t,b-.3,b))}
function label(s,y,ty,t0,t,col,x0){const k=eout(prog(t,t0,t0+.45));if(k<=0)return;ctx.save();ctx.globalAlpha=k;
  line(x0,y,x0+(520-x0)*k,y,col,4,[10,8]);ctx.restore();T(s,560,ty,{font:'900 52px Inter',fill:col,a:k,align:'left'})}
// fondo de velas ilustrativas
const Rr=rng(9);const BGC=[];{let p=50;for(let i=0;i<30;i++){const o=p,c=o+(Rr()-.48)*5;BGC.push({o,c,hi:Math.max(o,c)+Rr()*3,lo:Math.min(o,c)-Rr()*3});p=c}}
function series(a,top,hgt,upto){const mn=Math.min(...BGC.map(k=>k.lo)),mx=Math.max(...BGC.map(k=>k.hi));const Y=v=>top+hgt-(v-mn)/(mx-mn)*hgt;const w=1080/BGC.length;
  for(let i=0;i<Math.ceil(upto*BGC.length);i++){const k=BGC[i],x=i*w+w/2,c=k.c>=k.o?GR:RD;ctx.save();ctx.globalAlpha=a;line(x,Y(k.hi),x,Y(k.lo),c,3);ctx.fillStyle=c;ctx.fillRect(x-w*.3,Math.min(Y(k.o),Y(k.c)),w*.6,Math.max(4,Math.abs(Y(k.o)-Y(k.c))));ctx.restore()}}
function draw(t){bg();
  T('VELA JAPONESA',540,270,{font:'900 84px Inter',fill:CY});T('cómo leerla',540,355,{font:'800 52px Inter',fill:'#fff'});
  let a=fade(t,0,3.1);if(a>0){series(a*.9,520,600,eout(prog(t,.2,2.6)));T('?',540,1290,{font:'900 150px Inter',fill:CY,a:a*prog(t,1,1.6)})}
  a=fade(t,3.2,12.0);if(a>0){const k=eout(prog(t,3.3,4.2));candle(330,200,640,1000,760,1130,GR,k,a);
    if(t>4.2){label('CIERRE',760,730,4.4,t,GR,430);label('APERTURA',1000,970,5.6,t,CY,430)}
    if(t>8){label('MÁXIMO',640,610,8.0,t,'#fff',330);label('MÍNIMO',1130,1100,9.2,t,'#fff',330)}
    if(t>10.4){const b=eout(prog(t,10.4,11.0));ctx.save();ctx.globalAlpha=a*b;ctx.strokeStyle=CY;ctx.lineWidth=5;ctx.strokeRect(205,760,250,240);ctx.restore();T('CUERPO',330,1230,{font:'900 56px Inter',fill:CY,a:a*b});T('mecha = extremos',330,1295,{font:'700 36px Inter',fill:'#cbd5e1',a:a*b})}}
  a=fade(t,12.2,17.1);if(a>0){const k=eout(prog(t,12.3,13.2));candle(300,200,650,1000,760,1100,GR,k,a);candle(780,200,650,760,1000,1100,RD,k,a);
    T('ALCISTA',300,1200,{font:'900 56px Inter',fill:GR,a:a*prog(t,13,13.6)});T('cierre > apertura',300,1260,{font:'700 34px Inter',fill:'#cbd5e1',a:a*prog(t,13,13.6)});
    T('BAJISTA',780,1200,{font:'900 56px Inter',fill:RD,a:a*prog(t,14,14.6)});T('cierre < apertura',780,1260,{font:'700 34px Inter',fill:'#cbd5e1',a:a*prog(t,14,14.6)});
    T('UNA VELA ≠ SEÑAL',540,500,{font:'900 60px Inter',fill:CY,a:a*prog(t,15.4,16),glow:CY,gb:20})}
}
function cover(){bg();ctx.save();ctx.translate(0,40);
  ctx.save();ctx.globalAlpha=.55;series(1,1050,420,1);ctx.restore();
  ctx.fillStyle='rgba(10,14,20,.55)';ctx.fillRect(0,380,W,720);
  T('¿SABES LEER',540,500,{font:'900 100px Inter',fill:'#fff',stroke:BG,lw:14});
  T('UNA VELA',540,680,{font:'900 160px Inter',fill:CY,stroke:BG,lw:14,glow:CY,gb:36});
  T('JAPONESA?',540,850,{font:'900 150px Inter',fill:'#fff',stroke:BG,lw:14});
  RR(290,960,500,100,50);ctx.fillStyle=CY;ctx.fill();T('MÍRALO AHORA',540,1012,{font:'900 50px Inter',fill:BG});ctx.restore()}
</script></body></html>
