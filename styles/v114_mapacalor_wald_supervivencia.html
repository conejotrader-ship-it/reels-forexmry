Object.assign(ST,{txt:'#fff',mu:'#9fb0e0',acc:CY,pn:'#18224a',c:[CY,HY,HR,'#7dffb0']});

  ctx.save();ctx.strokeStyle='rgba(159,176,224,.07)';ctx.lineWidth=2;for(let x=0;x<=W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();

// avión visto desde arriba, centrado en (0,0), mide ≈ 560 de ancho y 700 de largo a escala 1
function planeShape(){ctx.beginPath();ctx.moveTo(0,-350);ctx.quadraticCurveTo(46,-300,46,-200);ctx.lineTo(46,-60);ctx.lineTo(280,40);ctx.lineTo(280,100);ctx.lineTo(46,70);ctx.lineTo(40,230);ctx.lineTo(150,290);ctx.lineTo(150,330);ctx.lineTo(30,310);ctx.lineTo(0,350);ctx.lineTo(-30,310);ctx.lineTo(-150,330);ctx.lineTo(-150,290);ctx.lineTo(-40,230);ctx.lineTo(-46,70);ctx.lineTo(-280,100);ctx.lineTo(-280,40);ctx.lineTo(-46,-60);ctx.lineTo(-46,-200);ctx.quadraticCurveTo(-46,-300,0,-350);ctx.closePath()}

const HITS=[[-200,50,60],[-240,80,40],[-150,30,50],[-110,60,40],[200,60,55],[240,75,40],[150,40,50],[120,65,38],[0,-20,52],[0,130,60],[10,170,45],[-10,95,40],[-110,300,38],[100,300,40],[0,260,50],[-30,-120,30],[35,-100,28],[-215,60,30],[260,70,28]];
const ENG=[[-130,-5],[130,-5]],COCK=[0,-250];
function plane(t,t0,cx,cy,s,heat,col){ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.fillStyle=col||'#2a3768';planeShape();ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#9fb0e0';ctx.stroke();
  if(heat){ctx.save();planeShape();ctx.clip();HITS.forEach(([x,y,r],i)=>{const k=eout(prog(t,t0+i*.12,t0+i*.12+.6));if(k<=.02)return;const g=ctx.createRadialGradient(x,y,0,x,y,r*1.6*k);g.addColorStop(0,'rgba(255,59,48,.95)');g.addColorStop(.45,'rgba(255,149,0,.6)');g.addColorStop(1,'rgba(255,214,10,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*1.6,0,7);ctx.fill()});ctx.restore()}
  ctx.restore()}
function marks(t,t0,cx,cy,s){const k=eout(prog(t,t0,t0+.8));if(k<=.02)return;const pul=1+.08*Math.sin(t*6);ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.globalAlpha*=k;ctx.strokeStyle=CY;ctx.lineWidth=8;ctx.setLineDash([16,10]);
  [...ENG,COCK].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,62*pul,0,7);ctx.stroke()});ctx.restore()}
