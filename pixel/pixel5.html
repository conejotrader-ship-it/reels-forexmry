<style>

canvas{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated}

.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45) 100%);pointer-events:none}

.subs.cta{color:#f2c453}
.subs.cta b{display:block;font-weight:400;color:#d7dff0;margin-top:6px;font-size:.92em}
.tag{position:absolute;white-space:nowrap;font-size:9px;font-size:2.5cqw;color:#0a0e18;background:#e8b84a;padding:4px 6px;display:none;transform:translate(-50%,-50%)}
.tag.g{background:#2ee6a6}.tag.r{background:#e2584b;color:#fff}.tag.b{background:#7fd3ff}.tag.c{background:#ff7a59}
.gauge{position:absolute;right:5%;top:30%;width:5.5%;height:25%;border:2px solid #cdd6e6;background:#0a0e18;display:none}
.gauge i{position:absolute;left:0;right:0;bottom:0;height:0;background:#e2584b}
.glab{position:absolute;right:3%;top:26%;font-size:8px;font-size:2.3cqw;color:#cdd6e6;display:none}
</style>
